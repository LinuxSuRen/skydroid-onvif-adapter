# 发布 Release 后自动构建六平台二进制并上传到该 Release，
# 同时构建多架构容器镜像推送 GHCR。
# Trigger: 在 GitHub 上发布(或编辑重发)一个 Release,或手动 workflow_dispatch。
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要上传二进制的 Release tag(例如 v0.1.0)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: build & upload binaries
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Cross-compile all platforms
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          COMMIT="${GITHUB_SHA::7}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${DATE}"
          mkdir -p dist
          TARGETS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )
          for target in "${TARGETS[@]}"; do
            GOOS="${target%%/*}"
            GOARCH="${target##*/}"
            NAME="skydroid-onvif-adapter_${GOOS}_${GOARCH}"
            echo "==> building ${NAME}"
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags "${LDFLAGS}" -o "dist/${NAME}/skydroid-onvif-adapter" ./cmd/skydroid-onvif-adapter
            cp LICENSE README.md "dist/${NAME}/"
            if [ "${GOOS}" = "windows" ]; then
              (cd "dist/${NAME}" && zip -r "../${NAME}.zip" .)
            else
              (cd "dist/${NAME}" && tar -czf "../${NAME}.tar.gz" .)
            fi
            rm -rf "dist/${NAME}"
          done

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 *.tar.gz *.zip > checksums.txt

      - name: Upload assets to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "上传以下资产到 Release ${TAG}:"
          ls -lh dist/
          gh release upload "${TAG}" dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber

  image:
    name: build & push container image
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # GHCR 要求镜像路径全小写。
          REPO_LOWER="$(echo "${GITHUB_REPOSITORY}" | tr 'A-Z' 'a-z')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPO_LOWER}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
